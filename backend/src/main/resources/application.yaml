server:
  port: ${PORT:10000}
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 150MB
    connection-timeout: 300000

spring:
  datasource:
    # [SECURITY C1] Credentials nhận qua env vars trên Render; fallback an toàn tránh crash khi parse
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-noisy-bar-b3e3g4u2-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:npg_6ECboSUKN8zG}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 0
      maximum-pool-size: 5
      idle-timeout: 60000
      max-lifetime: 300000
      connection-timeout: 5000
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
          time_zone: Asia/Ho_Chi_Minh
        order_inserts: true
        order_updates: true
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB
      file-size-threshold: 2MB
  jackson:
    time-zone: Asia/Ho_Chi_Minh

# [SECURITY M2] Chỉ expose health endpoint
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# [SECURITY C3] Tắt Swagger UI/API Docs trên production
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  jwt:
    # [SECURITY C1] JWT Secret
    secret: ${APP_JWT_SECRET:ZTY5ZDc4MzItMzQyMy00YTJhLWE4NDAtZTYxMTdkZDYxNzBmYTk1NzBjNGYtOWQ5My00NmYyLThhNGQtNjJjNThhMjBiYmY3}
  encryption:
