server:
  port: ${PORT:10000}
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 150MB
    connection-timeout: 300000

spring:
  datasource:
    # [SECURITY C1] Credentials PHẢI được set qua biến môi trường trên Render. Không hardcode ở đây.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 0
      maximum-pool-size: 5
      idle-timeout: 60000
      max-lifetime: 300000
      connection-timeout: 5000
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
          time_zone: Asia/Ho_Chi_Minh
        order_inserts: true
        order_updates: true
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB
      file-size-threshold: 2MB
  jackson:
    time-zone: Asia/Ho_Chi_Minh

# [SECURITY M2] Chỉ expose health endpoint (không lộ version, config, environment)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# [SECURITY C3] Tắt Swagger UI/API Docs trên production
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  jwt:
    # [SECURITY C1] JWT Secret PHẢI được set qua env var APP_JWT_SECRET (tối thiểu 64 ký tự ngẫu nhiên)
    secret: ${APP_JWT_SECRET}
  encryption:
    # [SECURITY M5] AES-256 key riêng biệt với JWT secret (set APP_ENCRYPTION_SECRET trên Render)
    secret: ${APP_ENCRYPTION_SECRET:${APP_JWT_SECRET}}
  google:
    client-id: ${APP_GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://teachtool-app.vercel.app,https://teachtool-vn.vercel.app,https://teachtool-edu.vercel.app,https://edu-frontend-sigma-snowy.vercel.app,http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}