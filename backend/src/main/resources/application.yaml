    secret: ${APP_ENCRYPTION_SECRET:ZTk1NzBjNGYtOWQ5My00NmYyLThhNGQtNjJjNThhMjBiYmY3X0VOQ1JZUFQ}
  google:
    client-id: ${APP_GOOGLE_CLIENT_ID:}
  cors:
