server:
  port: ${PORT:8081}
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 100MB
    connection-timeout: 180000

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/edu_manager}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:mikealpha11256}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  jwt:
    secret: ${APP_JWT_SECRET:teachtool_super_secure_jwt_secret_key_2026_classroom_manager_advanced_security_token}
  google:
    client-id: ${APP_GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}